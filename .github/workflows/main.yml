name: WNBA Predictor Engine

on:
  schedule:
    - cron: '0 13 * * *' # Automatically runs every single day at 9:00 AM Eastern Time (EDT)
  workflow_dispatch: # Allows you to press a button to run it manually anytime

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Initialize Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Execute Predictor Pipeline
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python pipeline.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Dashboard Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/public

  # GitHub's "github-pages" environment only allows deployments from the
  # default branch, so deployment is split into its own job (gated to main)
  # rather than blocking the whole run - manual workflow_dispatch runs on
  # other branches can still exercise the pipeline itself.
  deploy:
    needs: run-pipeline
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
